services:
  - type: web
    name: legalsathi-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.main:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./legalsathi.db
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: https://jerry11-tech.github.io
      - key: NEXT_PUBLIC_API_URL
        sync: false

