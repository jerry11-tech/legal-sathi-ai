services:
  - type: web
    name: legalsathi-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.main:app
    envVars:
      - key: DATABASE_URL
        fromService:
          type: psqldb
          name: legalsathi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app

  - type: psqldb
    name: legalsathi-db
    databaseName: legalsathi
    user: legalsathi_user
